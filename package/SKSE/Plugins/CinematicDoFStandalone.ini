[DepthOfField]
; Values can also be changed live through SKSE Menu Framework 3 (optional).
Enabled=true
AutoFocus=false
; Kept under its original key name for compatibility; this also disables DoF in world/local map menus.
DisableInMainAndLoadingMenus=true

; Normalized screen coordinate used by autofocus (center = 0.5, 0.5).
FocusX=0.5
FocusY=0.5
; Separately stored Screen AF coordinate used in first person.
FirstPersonFocusX=0.5
FirstPersonFocusY=0.5
AutoFocusOffsetMeters=0
TransitionSpeed=0.9

; Used only when AutoFocus=false. Valid range: 0.1-2000 m.
ManualFocusMeters=46.09

FocalLength=20.6
FNumber=6.4
FarPlaneMaxBlur=1.91
NearPlaneMaxBlur=0
; false keeps near blur disabled in first person; true enables the configured value.
EnableFirstPersonNearBlur=false
; true keeps clear-depth sky and far-depth moon pixels sharp. Defaults to false for legacy visual compatibility.
; Moon protection follows this same switch.
KeepSkySharp=false
BlurQuality=5
NearFarDistanceCompensation=3.98
BokehBusyFactor=0.25
HighlightBoost=0
PostBlurSmoothing=0
PetzvalStrength=0
ApertureBokeh=false
ApertureFill=false
ApertureShape=0
ApertureBlades=6
ApertureRoundness=0.35
ApertureShapeStrength=1
ApertureRotationDegrees=0
; Optional screenshot effect. Extracts strongly defocused bright points and adds lens-diffraction rays.
StarburstEnabled=false
; Values from 4 to 12. The UI exposes 4, 5, 6, 8, 10, and 12.
StarburstRays=6
StarburstStrength=1.00
StarburstLength=0.65
HighlightExtractionThreshold=0.65
StarburstRotationDegrees=0
BokehCoreFill=0.50
StarburstWideFlareSuppression=0.00
StarburstStrongLightSuppression=0.00
NearFocusRangeMeters=0
FarFocusRangeMeters=0

[Modes]
; true=use DoF during normal gameplay; false=use DoF only while dialogue focus is active.
; The master Enabled switch must remain true for either mode.
NormalGameplayEnabled=true

[Silhouette]
; Independent photo mode. It does not use or modify any DoF preset.
; The default palette is pure black foreground on pure white background.
Enabled=false
; Smooths only the binary silhouette boundary. Set false for the original crisp edge.
SmoothEdges=true
ForegroundR=0
ForegroundG=0
ForegroundB=0
BackgroundR=1
BackgroundG=1
BackgroundB=1

[ExperimentalTransparency]
; Optional hair blending. false keeps the standard rendering path.
; Mode 1 = stronger, softer blending behind hair; transparent materials may soften.
; Mode 2 = preserves more transparency, shape, and detail while blending hair.
Enabled=false
Mode=1

[Interface]
; true=Japanese UI, false=English UI. The language can also be changed in-game.
Japanese=false

[Hotkeys]
; DirectInput keyboard scan code. 0=unassigned. Assign or clear it from the in-game UI.
ToggleDoF=0
ToggleSilhouette=0

[TargetFocus]
; While the dialogue menu is open, focus follows the current speaker's head.
; Stored lens IDs remain compatible with older INIs:
; 0=Gameplay, 1=Cinematic, 2=Photo Portrait, 3=Photo Wide, 4=Custom 1, 5=Custom 2, 6=View Focus, 7=First-Person Photo, 8=Aperture Bokeh, 9=Starburst.
; UI order: Gameplay, Cinematic, View Focus, Photo Portrait, Photo Wide, First-Person Photo, Aperture Bokeh, Starburst, Custom 1, Custom 2.
DialogueEnabled=true
DialoguePreset=0
DialogueDepthStrength=2.5

; ConsoleEnabled keeps its old key name for compatibility.
; TargetSource: 0=player automatically (third person only), 1=reference selected in the console.
; TargetFocusOffsetMeters shifts the measured target distance: negative=toward camera, positive=farther away.
ConsoleEnabled=false
TargetSource=0
TargetFocusOffsetMeters=0
; When automatic player tracking pauses in first person, use the first-person Screen AF position instead.
UseFirstPersonScreenAFFallback=false

[TDMLockFocus]
; Optional integration with True Directional Movement. No effect when TDM is not installed.
; Dialogue focus keeps priority and normal settings resume after target lock ends.
Enabled=false
; 0=Standard, 1=Smooth distance-adaptive, 2=Target emphasis.
Profile=0
BlurStrength=1
NearBlurStrength=0

[SneakFocus]
; When enabled, sneaking temporarily focuses at the center of the screen.
; Profile: 0=Natural, 1=Suspense. BlurStrength: 0.0-3.0 (1.0=baseline).
Enabled=false
Profile=0
BlurStrength=1

; Preset slots can be overwritten in-game with "Store Current".
; Each preset stores all normal DoF values plus the six Target Focus values below.
